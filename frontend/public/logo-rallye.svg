        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="26" letter-spacing="-1">RH</text>
  <rect x="14" y="48" width="36" height="4" fill="#0E7C86"/>
</svg>
