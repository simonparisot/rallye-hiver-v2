          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  deleteParcours:
    handler: src/functions/parcours/delete.handler
    events:
      - http:
          path: /parcours/{parcoursId}
          method: delete
          cors: true
          authorizer:
