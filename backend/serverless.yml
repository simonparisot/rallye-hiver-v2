service: rallye-hiver-backend

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-west-1
  stage: prod
  memorySize: 256
  timeout: 30
  apiGateway:
    shouldStartNameWithService: true
    minimumCompressionSize: 1024
  # Enable API Gateway caching for performance-critical endpoints
  # Cache reduces latency from ~800ms (cold start) to <10ms for cached responses
  caching:
    enabled: true
    ttlInSeconds: 300  # 5 minutes - good balance for semi-static data
  environment:
    USERS_TABLE: ${self:service}-users
    TEAMS_TABLE: ${self:service}-teams
    ENIGMAS_TABLE: ${self:service}-enigmas
    PARCOURS_TABLE: ${self:service}-parcours
    TEAM_ENIGMA_PROGRESS_TABLE: ${self:service}-team-enigma-progress
    PASSWORD_ATTEMPTS_TABLE: ${self:service}-password-attempts
    TEAM_PARCOURS_ACCESS_TABLE: ${self:service}-team-parcours-access
    GAME_STATUS_TABLE: ${self:service}-game-status
    ENIGMA_DIFFICULTY_CACHE_TABLE: ${self:service}-enigma-difficulty-cache
    HINT_REQUESTS_TABLE: ${self:service}-hint-requests
    # Secrets et identifiants lus dans SSM Parameter Store au moment du
    # déploiement, sous /rallye-hiver/<stage>/. Plus rien n'a donc à être fourni
    # en variables d'environnement pour déployer.
    COGNITO_USER_POOL_ID: ${ssm:/rallye-hiver/${self:provider.stage}/cognito-user-pool-id}
    COGNITO_CLIENT_ID: ${ssm:/rallye-hiver/${self:provider.stage}/cognito-client-id}
    COGNITO_REGION: ${self:provider.region}
    STRIPE_SECRET_KEY: ${ssm:/rallye-hiver/${self:provider.stage}/stripe-secret-key}
    STRIPE_WEBHOOK_SECRET: ${ssm:/rallye-hiver/${self:provider.stage}/stripe-webhook-secret}
    STRIPE_PRICE_ID: ${ssm:/rallye-hiver/${self:provider.stage}/stripe-price-id}
    CORS_ORIGIN: ${ssm:/rallye-hiver/${self:provider.stage}/cors-origin}
    ANTHROPIC_API_KEY: ${ssm:/rallye-hiver/${self:provider.stage}/anthropic-api-key}
    # Modele charge de choisir l'indice. Parametrable sans redeploiement de code.
    HINT_MODEL: ${env:HINT_MODEL, 'claude-opus-5'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.USERS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.USERS_TABLE}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.TEAMS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ENIGMAS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.ENIGMAS_TABLE}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.PARCOURS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.PARCOURS_TABLE}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.TEAM_ENIGMA_PROGRESS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.TEAM_ENIGMA_PROGRESS_TABLE}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.PASSWORD_ATTEMPTS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.PASSWORD_ATTEMPTS_TABLE}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.TEAM_PARCOURS_ACCESS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.GAME_STATUS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.HINT_REQUESTS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.HINT_REQUESTS_TABLE}/index/*
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminDeleteUser
          Resource:
            - arn:aws:cognito-idp:${self:provider.region}:*:userpool/${ssm:/rallye-hiver/${self:provider.stage}/cognito-user-pool-id}
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:PutObjectAcl
            - s3:GetObject
          Resource:
            - arn:aws:s3:::rallyehiver-enigmas/*

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude:
      - aws-sdk
    target: node20
    platform: node

functions:
  authorizer:
    handler: src/functions/authorizer.handler

  # Auth endpoints
  signup:
    handler: src/functions/auth/signup.handler
    events:
      - http:
          path: /auth/signup
          method: post
          cors: true

  login:
    handler: src/functions/auth/login.handler
    events:
      - http:
          path: /auth/login
          method: post
          cors: true

  getMe:
    handler: src/functions/auth/me.handler
    events:
      - http:
          path: /auth/me
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  forgotPassword:
    handler: src/functions/auth/forgotPassword.handler
    events:
      - http:
          path: /auth/forgot-password
          method: post
          cors: true

  resetPassword:
    handler: src/functions/auth/resetPassword.handler
    events:
      - http:
          path: /auth/reset-password
          method: post
          cors: true

  refresh:
    handler: src/functions/auth/refresh.handler
    events:
      - http:
          path: /auth/refresh
          method: post
          cors: true

  # User endpoints
  getPendingRequests:
    handler: src/functions/users/getPendingRequests.handler
    events:
      - http:
          path: /users/pending-requests
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  # Team endpoints
  createTeam:
    handler: src/functions/teams/create.handler
    events:
      - http:
          path: /teams
          method: post
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  listTeams:
    handler: src/functions/teams/list.handler
    events:
      - http:
          path: /teams
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  getTeam:
    handler: src/functions/teams/get.handler
    events:
      - http:
          path: /teams/{teamId}
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  joinTeam:
    handler: src/functions/teams/join.handler
    events:
      - http:
          path: /teams/{teamId}/join
          method: post
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  approveRequest:
    handler: src/functions/teams/approve.handler
    events:
      - http:
          path: /teams/{teamId}/approve/{userId}
          method: post
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  rejectRequest:
    handler: src/functions/teams/reject.handler
    events:
      - http:
          path: /teams/{teamId}/reject/{userId}
          method: post
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  removeMember:
    handler: src/functions/teams/removeMember.handler
    events:
      - http:
          path: /teams/{teamId}/members/{userId}
          method: delete
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  cancelJoinRequest:
    handler: src/functions/teams/cancelJoin.handler
    events:
      - http:
          path: /teams/{teamId}/cancel-join
          method: delete
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  getTeamStats:
    handler: src/functions/teams/getStats.handler
    events:
      - http:
          path: /teams/stats
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  # Payment endpoints
  createCheckout:
    handler: src/functions/payments/createCheckout.handler
    events:
      - http:
          path: /payments/create-checkout
          method: post
          cors: true
          authorizer:
