    # Cognito User Pool
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        UserPoolName: ${self:service}-user-pool
        AutoVerifiedAttributes:
          - email
        UsernameAttributes:
          - email
        Schema:
          - Name: email
            AttributeDataType: String
            Required: true
            Mutable: true
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        VerificationMessageTemplate:
          DefaultEmailOption: CONFIRM_WITH_CODE
          EmailSubject: "Rallye d'Hiver - Réinitialisation de votre mot de passe"
          EmailMessage: |
            Bonjour,

            Vous avez demandé la réinitialisation de votre mot de passe pour le Rallye d'Hiver.

            Votre code de vérification est : {####}

            Ce code est valide pendant 24 heures.

            Si vous n'avez pas demandé cette réinitialisation, vous pouvez ignorer ce message en toute sécurité.

            Bonne chance pour le rallye !
            L'équipe du Rallye d'Hiver

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-client
        UserPoolId:
          Ref: CognitoUserPool
        ExplicitAuthFlows:
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        GenerateSecret: false
        AccessTokenValidity: 24
        IdTokenValidity: 24
        RefreshTokenValidity: 90
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days

  Outputs:
    UserPoolId:
      Value:
        Ref: CognitoUserPool
      Export:
        Name: ${self:service}-UserPoolId

    UserPoolClientId:
      Value:
        Ref: CognitoUserPoolClient
      Export:
        Name: ${self:service}-UserPoolClientId

    ServiceEndpoint:
      Value:
        Fn::Join:
          - ''
          - - 'https://'
            - Ref: ApiGatewayRestApi
            - '.execute-api.'
            - ${self:provider.region}
            - '.amazonaws.com/prod'
      Export:
        Name: ${self:service}-ServiceEndpoint

plugins:
  - serverless-offline
