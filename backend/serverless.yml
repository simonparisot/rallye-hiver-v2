            resultTtlInSeconds: 0

  stripeWebhook:
    handler: src/functions/payments/webhook.handler
    events:
      - http:
          path: /payments/webhook
          method: post

  # Content endpoints
  checkAccess:
    handler: src/functions/content/checkAccess.handler
    events:
      - http:
          path: /content/check-access
          method: get
          cors: true
          authorizer:
