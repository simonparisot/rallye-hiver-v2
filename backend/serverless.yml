  adminTeamsProgressGrid:
    handler: src/functions/admin/teams/progressGrid.handler
    events:
      - http:
          path: /admin/teams/progress-grid
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  adminListUsers:
    handler: src/functions/admin/users/list.handler
    events:
      - http:
          path: /admin/users
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  adminListAllUsers:
    handler: src/functions/admin/users/listAll.handler
    events:
      - http:
          path: /admin/users/all
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  adminGetTeam:
    handler: src/functions/admin/teams/get.handler
    events:
      - http:
          path: /admin/teams/{teamId}
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  adminGetTeamProgress:
    handler: src/functions/admin/teams/getProgress.handler
    events:
      - http:
          path: /admin/teams/{teamId}/progress
          method: get
          cors: true
