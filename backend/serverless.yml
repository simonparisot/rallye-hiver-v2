            resultTtlInSeconds: 0

  markParcoursCompleted:
    handler: src/functions/parcours/markCompleted.handler
    events:
      - http:
          path: /parcours/{parcoursId}/complete
          method: post
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  unmarkParcoursCompleted:
    handler: src/functions/parcours/unmarkCompleted.handler
    events:
      - http:
          path: /parcours/{parcoursId}/complete
          method: delete
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  # Progress and game endpoints
  submitPasswordAttempt:
    handler: src/functions/progress/submitAttempt.handler
    events:
      - http:
          path: /progress/attempt
          method: post
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  getTeamProgress:
    handler: src/functions/progress/getProgress.handler
    events:
      - http:
          path: /progress
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  getAccessibleParcours:
    handler: src/functions/progress/getAccessibleParcours.handler
    events:
      - http:
          path: /progress/parcours
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  # Hint endpoints
  requestHint:
    handler: src/functions/hints/requestHint.handler
    # Le choix de l'indice passe par un appel au modele : quelques secondes,
    # parfois davantage. Le defaut de 30 s ne laisse pas de marge.
    timeout: 60
    events:
      - http:
          path: /hints/{enigmaId}/request
          method: post
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  listHints:
    handler: src/functions/hints/listHints.handler
    events:
      - http:
          path: /hints/{enigmaId}
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  # Game status endpoints
  getGameStatus:
    handler: src/functions/game/status.handler
    events:
      - http:
          path: /game/status
          method: get
          cors: true

  # Admin endpoints
