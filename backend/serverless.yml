      - http:
          path: /enigmas/by-difficulty
          method: get
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  updateEnigma:
    handler: src/functions/enigmas/update.handler
    events:
      - http:
          path: /enigmas/{enigmaId}
          method: put
          cors:
            origin: 'https://rallyehiver.fr'
            headers:
              - Content-Type
              - Authorization
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - X-Requested-With
            allowCredentials: true
            maxAge: 3600
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  deleteEnigma:
    handler: src/functions/enigmas/delete.handler
    events:
      - http:
          path: /enigmas/{enigmaId}
          method: delete
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  # Parcours management endpoints (admin)
  createParcours:
    handler: src/functions/parcours/create.handler
    events:
      - http:
          path: /parcours
          method: post
          cors: true
          authorizer:
            name: authorizer
            resultTtlInSeconds: 0

  listParcours:
    handler: src/functions/parcours/list.handler
