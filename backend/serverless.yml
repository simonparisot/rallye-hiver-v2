            resultTtlInSeconds: 0

  adminLogin:
    handler: src/functions/admin/auth/login.handler
    events:
      - http:
          path: /admin/auth/login
          method: post
          cors: true

  adminVerify:
    handler: src/functions/admin/auth/verify.handler
    events:
      - http:
          path: /admin/auth/verify
          method: get
          cors: true
